name: Deploy — Dev
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build frontend
        working-directory: app
        run: npm ci && npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG_DEV }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN_DEV }}
          VITE_GA_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID_DEV }}
      - name: Install functions deps
        working-directory: functions
        run: npm ci
      - name: Deploy hosting
        uses: w9jds/firebase-action@v13.35.1
        with:
          args: deploy --only hosting --force --project dev
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
      - name: Deploy functions
        uses: w9jds/firebase-action@v13.35.1
        with:
          args: deploy --only functions --force --project dev
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        continue-on-error: true
      - name: Deploy Firestore rules & indexes
        uses: w9jds/firebase-action@v13.35.1
        with:
          args: deploy --only firestore --project dev
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        continue-on-error: true
