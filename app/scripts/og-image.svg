<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="northGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgFade)"/>

  <!-- Subtle radial bearing lines from compass center (910, 315) -->
  <line x1="910" y1="315" x2="910" y2="-10" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="1210" y2="315" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="910" y2="640" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="610" y2="315" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="1210" y2="-10" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="1210" y2="640" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="610" y2="-10" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="910" y1="315" x2="610" y2="640" stroke="#0d1829" stroke-width="1.5"/>

  <!-- Vertical divider -->
  <line x1="640" y1="60" x2="640" y2="570" stroke="#0f172a" stroke-width="1.5"/>

  <!-- === COMPASS ROSE (centered at 910, 315, radius 220) === -->
  <!-- Outer ring -->
  <circle cx="910" cy="315" r="220" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <!-- Second inner ring -->
  <circle cx="910" cy="315" r="180" fill="none" stroke="#111827" stroke-width="1"/>

  <!-- Cardinal ticks -->
  <line x1="910" y1="96" x2="910" y2="122" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="1129" y1="315" x2="1103" y2="315" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="910" y1="534" x2="910" y2="508" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="691" y1="315" x2="717" y2="315" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

  <!-- Intercardinal ticks -->
  <line x1="1065" y1="160" x2="1054" y2="171" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1065" y1="470" x2="1054" y2="459" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="755" y1="470" x2="766" y2="459" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="755" y1="160" x2="766" y2="171" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>

  <!-- South needle (dark) -->
  <polygon points="894,315 910,505 926,315" fill="#374151"/>

  <!-- North needle (amber gradient) -->
  <polygon points="910,126 894,315 926,315" fill="url(#northGrad)"/>

  <!-- Center cap -->
  <circle cx="910" cy="315" r="24" fill="#030712" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="910" cy="315" r="10" fill="#fbbf24"/>

  <!-- "N" label above compass -->
  <text x="910" y="88" font-family="Liberation Sans, DejaVu Sans, FreeSans, sans-serif"
        font-size="28" font-weight="700" fill="#fbbf24" text-anchor="middle">N</text>

  <!-- === LEFT SIDE TEXT === -->

  <!-- App name -->
  <text x="80" y="310" font-family="Liberation Sans, DejaVu Sans, FreeSans, sans-serif"
        font-size="118" font-weight="700" fill="#fbbf24" letter-spacing="-2">Bearings</text>

  <!-- Tagline -->
  <text x="80" y="368" font-family="Liberation Sans, DejaVu Sans, FreeSans, sans-serif"
        font-size="26" fill="#6b7280" letter-spacing="0.3">Collaborative GPS + compass triangulation</text>

  <!-- Accent line -->
  <line x1="80" y1="400" x2="500" y2="400" stroke="#1f2937" stroke-width="1.5"/>

  <!-- URL / sub-tagline -->
  <text x="80" y="430" font-family="Liberation Sans, DejaVu Sans, FreeSans, sans-serif"
        font-size="20" fill="#374151" letter-spacing="1.5">BEARINGS-APP.WEB.APP</text>
</svg>
