<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="northGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#030712"/>

  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Cardinal point ticks -->
  <line x1="256" y1="48" x2="256" y2="84" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="464" y1="256" x2="428" y2="256" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="464" x2="256" y2="428" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="256" x2="84" y2="256" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

  <!-- Intercardinal ticks (smaller) -->
  <line x1="404" y1="108" x2="390" y2="122" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="404" y1="404" x2="390" y2="390" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="108" y1="404" x2="122" y2="390" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="108" y1="108" x2="122" y2="122" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>

  <!-- South needle (dark gray, pointing down) -->
  <polygon points="236,256 256,420 276,256" fill="#374151"/>
  <!-- South needle highlight line -->
  <line x1="256" y1="256" x2="256" y2="420" stroke="#4b5563" stroke-width="1.5" opacity="0.5"/>

  <!-- North needle (amber, pointing up) -->
  <polygon points="256,96 236,256 276,256" fill="url(#northGrad)"/>
  <!-- North needle highlight -->
  <line x1="256" y1="96" x2="256" y2="256" stroke="#fde68a" stroke-width="1.5" opacity="0.4"/>

  <!-- Center cap -->
  <circle cx="256" cy="256" r="24" fill="#030712" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="256" cy="256" r="10" fill="#fbbf24"/>
</svg>
